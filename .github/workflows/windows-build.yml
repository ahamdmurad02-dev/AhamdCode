name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 pyinstaller pytest psutil pybind11
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Validate source and tests
        shell: pwsh
        run: |
          python -m pytest -q tests
          python app.py status
          python app.py help
          python app.py model
          if ($LASTEXITCODE -ne 1) { throw "python app.py model must return 1 when no checkpoint exists" }

      - name: Build optional C++ helper
        shell: pwsh
        run: |
          cmake -S . -B build_cpp -A x64
          cmake --build build_cpp --config Release

      - name: Package native application
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean AhamdCode.spec

      - name: Locate and validate EXE
        id: exe
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'dist\AhamdCode\AhamdCode.exe'
          if (-not (Test-Path $exe)) { throw 'dist\AhamdCode\AhamdCode.exe was not produced' }
          $item = Get-Item $exe
          if ($item.Length -le 0) { throw 'EXE size is zero' }
          $bytes = [IO.File]::ReadAllBytes($exe)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Output is not a Windows PE executable' }
          echo "exe=$exe" >> $env:GITHUB_OUTPUT
          echo "size=$($item.Length)" >> $env:GITHUB_OUTPUT
          Write-Host "EXE $exe SIZE $($item.Length)"

      - name: Optional Authenticode signing
        id: sign
        shell: pwsh
        env:
          CODE_SIGN_CERT: ${{ secrets.CODE_SIGN_CERT }}
          CODE_SIGN_PASSWORD: ${{ secrets.CODE_SIGN_PASSWORD }}
        run: |
          $exe = '${{ steps.exe.outputs.exe }}'
          if ([string]::IsNullOrWhiteSpace($env:CODE_SIGN_CERT) -or [string]::IsNullOrWhiteSpace($env:CODE_SIGN_PASSWORD)) {
            'status=UNSIGNED - READY FOR SIGNING' >> $env:GITHUB_OUTPUT
            Write-Host 'No signing secrets configured; leaving the EXE unsigned.'
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODE_SIGN_CERT))
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'x64\\signtool.exe$' } | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found' }
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:CODE_SIGN_PASSWORD $exe
          if ($LASTEXITCODE -ne 0) { throw 'signtool sign failed' }
          & $signtool.FullName verify /pa $exe
          if ($LASTEXITCODE -ne 0) { throw 'signature verification failed' }
          'status=Signed' >> $env:GITHUB_OUTPUT
          Remove-Item $pfx -Force -ErrorAction SilentlyContinue

      - name: Write checksum and BUILD_INFO
        shell: pwsh
        run: |
          $exe = '${{ steps.exe.outputs.exe }}'
          $outDir = Split-Path $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          $size = (Get-Item $exe).Length
          $status = '${{ steps.sign.outputs.status }}'
          if ([string]::IsNullOrWhiteSpace($status)) { $status = 'UNSIGNED - READY FOR SIGNING' }
          Set-Content (Join-Path $outDir 'AhamdCode.exe.sha256.txt') -Value "$hash  AhamdCode.exe" -Encoding ascii
          $py = python -c "import sys; print(sys.version.split()[0])"
          $torch = python -c "import torch; print(torch.__version__)"
          @(
            'Application: AhamdCode',
            'Version: 0.1 Mini',
            'Platform: Windows x64',
            "Python Version: $py",
            "PyTorch Version: $torch",
            "Build Date: $(Get-Date -Format o)",
            'Git Commit: ${{ github.sha }}',
            "EXE Size: $size",
            "SHA256: $hash",
            "Code Signing Status: $status",
            'Test Result: pytest passed'
          ) | Set-Content (Join-Path $outDir 'BUILD_INFO.txt') -Encoding utf8
          Write-Host "SHA256 $hash"
          Write-Host "Code Signing Status: $status"

      - name: Upload required artifact
        uses: actions/upload-artifact@v4
        with:
          name: AhamdCode-windows-x64
          path: |
            dist/AhamdCode/AhamdCode.exe
            dist/AhamdCode/AhamdCode.exe.sha256.txt
            dist/AhamdCode/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14
